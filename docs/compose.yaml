services:
  # https://onthefencedevelopment.com/2025/06/17/developing-a-jekyll-site-with-docker.html
  jekyll:
    build:
      dockerfile_inline: |
        FROM ruby:3.1

        RUN apt-get update && apt-get install -y build-essential nodejs npm

        WORKDIR /srv/jekyll

        RUN gem install bundler jekyll

        EXPOSE 4000
    volumes:
      - .:/srv/jekyll
    ports:
      - "4000:4000"
    working_dir: /srv/jekyll
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --watch --incremental"
